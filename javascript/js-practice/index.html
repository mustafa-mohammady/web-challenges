<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button type="button" class="mode_btn" data-js="Dark_mode">
      Dark Mode
    </button>
    <button type="button" class="mode_btn" data-js="Light_mode">
      Light Mode
    </button>
    <button type="button" class="mode_btn" data-js="toggle">Toggle Mode</button>
  </body>
  <script>
    const dark_mode_btn = document.querySelector("[data-js='Dark_mode']");
    const light_mode_btn = document.querySelector("[data-js='Light_mode']");
    const toggle_btn = document.querySelector("[data-js='toggle']");
    const body = document.body;
    dark_mode_btn.addEventListener("click", () => {
      body.classList.add("dark");
    });
    light_mode_btn.addEventListener("click", () => {
      body.classList.remove("dark");
    });
    toggle_btn.addEventListener("click", function () {
      body.classList.toggle("dark");
    });
  </script>
</html>
